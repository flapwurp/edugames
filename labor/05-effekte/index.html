<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Labor · Gizeh im Tageslauf</title>
<link rel="icon" href="data:,">
<style>
  :root{--panel:rgba(14,26,43,.86);--line:rgba(217,180,90,.35);--gold:#d9b45a;--gold-hi:#f3dc9a;--text:#efe4c8;--muted:#a9b0cc;--font:system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--text);font:16px/1.4 var(--font);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:8px 14px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  button[aria-pressed="true"]{background:var(--gold);color:#0e1a2b;border-color:var(--gold)}
  button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
  .oben{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
  .oben>*{pointer-events:auto}
  .oben h1{font-size:17px;margin:0;padding:10px 14px;border-radius:12px;background:var(--panel);pointer-events:none}
  .oben .platz{flex:1}
  .unten{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .zeit{display:flex;align-items:center;gap:12px;flex:1 1 320px}
  .zeit label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .zeit output{font-variant-numeric:tabular-nums;color:var(--gold-hi);min-width:76px;text-align:right;font-size:18px}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:30px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:var(--spur);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
  input[type=range]::-moz-range-track{height:10px;border-radius:10px;background:var(--spur)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;margin-top:-8px;background:radial-gradient(circle at 40% 35%,#fff6d6,#f2b94b 60%,#b06d14);box-shadow:0 0 0 3px rgba(243,220,154,.3),0 0 16px rgba(255,190,80,.7)}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6d6,#f2b94b 60%,#b06d14)}
  .credit{position:fixed;right:12px;top:66px;max-width:min(60vw,520px);font-size:12px;color:var(--muted);background:var(--panel);padding:5px 9px;border-radius:8px;text-align:right}
  .credit a{color:var(--gold-hi)}
  .fps{position:fixed;left:12px;top:66px;font-size:12px;color:var(--muted);background:var(--panel);padding:5px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}
  #fehler{position:fixed;inset:0;display:grid;place-items:center;background:#0e1a2b;padding:30px;text-align:center}
</style>
<script type="module" src="main.js"></script>
</head>
<body>
<canvas id="bild" aria-label="Pyramiden von Gizeh im Tageslauf; seitlich wischen verschiebt die Ansicht"></canvas>
<div class="oben">
  <button type="button" onclick="location.href='../'">← Labor</button>
  <h1>Gizeh im Tageslauf</h1>
  <span class="platz"></span>
  <button type="button" id="ton" aria-pressed="false">Ton an</button>
</div>
<div class="fps" id="fps"></div>
<div class="credit">Bild: Rolfcosar, <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.de" target="_blank" rel="noopener">CC BY-SA 4.0</a>, bearbeitet (Ebenen, Retusche, Licht per Shader) · <a href="https://commons.wikimedia.org/wiki/File:Pyramiden_von_Gizeh.jpg" target="_blank" rel="noopener">Fundstelle</a></div>
<div class="unten">
  <div class="zeit">
    <label for="stunde">Tageszeit</label>
    <input id="stunde" type="range" min="0" max="24" step="0.02" value="6.6">
    <output id="uhr" for="stunde">06:36 Uhr</output>
  </div>
  <button type="button" id="lauf" aria-pressed="false">Tag ablaufen lassen</button>
  <button type="button" id="flimmern" aria-pressed="true">Hitzeflimmern</button>
</div>
<div id="fehler" hidden></div>
<noscript>Diese Seite braucht JavaScript.</noscript>
</body>
</html>
