<head>

<body>
<header class="leiste">
  <div class="chip"><span class="punkt" id="punkt"></span><span id="statusText">Verbinde …</span></div>
  <div class="platz"></div>
  <button id="bots" aria-pressed="false">Testpaare simulieren</button>
  <button id="ende">Beenden</button>
</header>
<section class="kopf">
  <h1>Lehrer-Monitor · Klasse</h1>
  <span class="gross" id="klasseCode"></span>
  <p>Auf den iPads: Labor → Schritt 8 → diesen Code und die Paarnummer eingeben. Goldener Rand im Mini-Feld = versteckter Schatz (nur hier sichtbar).</p>
</section>
<div class="werte">
  <div class="chip"><span>Paare aktiv</span> <b id="wPaare">0</b></div>
  <div class="chip"><span>Geräte</span> <b id="wGeraete">0</b></div>
  <div class="chip"><span>Nachrichten/s im Projekt</span> <b id="wRate">0</b><span>von 100</span></div>
  <div class="chip"><span>zum Server</span> <b id="wServer">–</b></div>
</div>
<main class="paare" id="paare"></main>
