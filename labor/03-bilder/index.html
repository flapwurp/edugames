<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Labor · Bilder im Spiel</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#0e1a2b;--panel:#13223a;--line:rgba(217,180,90,.35);--gold:#d9b45a;--gold-hi:#f3dc9a;--text:#efe4c8;--muted:#a9b0cc;
    --font:system-ui,-apple-system,"Segoe UI",sans-serif;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 var(--font);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #spiel{position:fixed;inset:0;touch-action:none}
  #spiel canvas{display:block}
  button{font:inherit;color:var(--text);background:rgba(14,26,43,.86);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:8px 14px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
  .leiste{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
  .leiste>*{pointer-events:auto}
  .leiste h1{font-size:17px;margin:0 6px;padding:8px 12px;border-radius:12px;background:rgba(14,26,43,.86);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .leiste .platz{flex:1;pointer-events:none}
  .credit{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));max-width:min(70vw,720px);font-size:12px;color:var(--muted);background:rgba(14,26,43,.8);padding:5px 9px;border-radius:8px;z-index:4}
  .credit a{color:var(--gold-hi)}
  #panel{position:fixed;z-index:6;right:10px;top:66px;bottom:46px;width:min(380px,44vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.45);-webkit-user-select:text;user-select:text}
  #panel h2{margin:0 40px 8px 0;font-size:22px;color:var(--gold-hi)}
  #panel p{margin:0 0 10px}
  #panel img{width:100%;border-radius:10px;display:block;margin:4px 0 6px}
  #panel figcaption{font-size:12px;color:var(--muted);margin-bottom:10px}
  #panel .x{position:absolute;top:10px;right:10px;width:44px;padding:0}
  @media (max-aspect-ratio:1/1){#panel{left:10px;right:10px;width:auto;top:auto;max-height:52vh}}
  #menu{position:fixed;inset:0;overflow:auto;padding:max(20px,env(safe-area-inset-top)) 20px 30px;z-index:8;background:var(--bg)}
  #menu .wrap{max-width:1000px;margin:0 auto}
  #menu h1{font-size:30px;margin:6px 0 4px}
  #menu .lede{color:var(--muted);margin:0 0 20px;max-width:64ch}
  .karten{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .karte{all:unset;cursor:pointer;display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .karte:focus-visible{outline:2px solid var(--gold-hi)}
  .karte .bild{height:170px;background-size:cover;background-position:center}
  .karte div.t{padding:12px 16px 16px}
  .karte strong{display:block;font-size:19px;color:var(--gold-hi);margin-bottom:4px}
  .karte span{font-size:14px;color:var(--muted)}
  #menu .unten{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  #menu a{color:var(--gold-hi)}
  #nachweise{position:fixed;inset:0;z-index:10;background:rgba(5,10,20,.7);display:grid;place-items:center;padding:20px}
  #nachweise .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;-webkit-user-select:text;user-select:text}
  #nachweise h2{margin:0 0 12px;color:var(--gold-hi)}
  #nachweise li{margin:0 0 12px;font-size:14px}
  #nachweise a{color:var(--gold-hi)}
  [hidden]{display:none!important}
</style>
<script type="module" src="main.js"></script>
</head>
<body>
<div id="spiel"></div>

<div class="leiste" id="leiste" hidden>
  <button type="button" id="zurueck">← Übersicht</button>
  <h1 id="titel"></h1>
  <span class="platz"></span>
  <button type="button" id="modus" hidden>Ansicht: Foto</button>
  <button type="button" class="nachweis-knopf">Bildnachweise</button>
</div>
<div class="credit" id="credit" hidden></div>

<aside id="panel" hidden aria-live="polite">
  <button type="button" class="x" aria-label="Schließen">✕</button>
  <h2></h2>
  <div class="inhalt"></div>
</aside>

<section id="menu">
  <div class="wrap">
    <p><a href="../">← Labor</a> · Schritt 3</p>
    <h1>Bilder im Spiel</h1>
    <p class="lede">Drei Arten, echte Bilder in ein Spiel einzubauen: ein Satellitenbild als begehbare Karte, ein Foto in Ebenen zerlegt, und eine Quelle zum Untersuchen. Ziehen verschiebt, zwei Finger zoomen, Punkte antippen öffnet Erklärungen.</p>
    <div class="karten">
      <button class="karte" type="button" data-ziel="karte"><div class="bild" style="background-image:url(assets/nil-delta.webp)"></div><div class="t"><strong>Der Nil von oben</strong><span>NASA-Satellitenbild als Karte zum Scrollen und Zoomen, vom Viktoriasee bis zum Delta.</span></div></button>
      <button class="karte" type="button" data-ziel="gizeh"><div class="bild" style="background-image:url(assets/gizeh-cheops-chephren.webp);background-color:#9fc1df"></div><div class="t"><strong>Gizeh in Ebenen</strong><span>Ein Foto, zerlegt in Ebenen, die beim Wischen unterschiedlich schnell wandern.</span></div></button>
      <button class="karte" type="button" data-ziel="quelle"><div class="bild" style="background-image:url(assets/menna-013.webp)"></div><div class="t"><strong>Quelle untersuchen</strong><span>Wandmalerei aus dem Grab des Menna, mit Umzeichnung und antippbaren Stellen.</span></div></button>
    </div>
    <div class="unten">
      <button type="button" class="nachweis-knopf">Bildnachweise</button>
      <span style="color:var(--muted);font-size:14px" id="groesse"></span>
    </div>
  </div>
</section>

<div id="nachweise" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-label="Bildnachweise">
    <h2>Bildnachweise</h2>
    <ul id="nachweisliste"></ul>
    <button type="button" id="nachweise-zu">Schließen</button>
  </div>
</div>
<noscript>Diese Seite braucht JavaScript.</noscript>
</body>
</html>
